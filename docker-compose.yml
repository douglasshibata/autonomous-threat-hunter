services:
  threat-hunter:
    image: python:3.11-slim
    container_name: autonomous-threat-hunter
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
    depends_on:
      - qdrant
      - opensearch
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python3 run_simulation.py"
    restart: "no"

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: threat-hunter-qdrant
    ports:
      - "6333:6333"
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: threat-hunter-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    restart: unless-stopped
